# Gradi APK na GitHub-u (besplatno), bez Android Studija na tvom računaru.
# Koristi: napravi privatni GitHub repo, ubaci sadržaj foldera android-wrapper/ (ovaj fajl mora biti u .github/workflows/),
# pa otvori Actions → "Build APK" → Run workflow. APK preuzmeš iz "Artifacts" (stremio-hub-debug).
name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-hub-debug
          path: app/build/outputs/apk/debug/app-debug.apk
